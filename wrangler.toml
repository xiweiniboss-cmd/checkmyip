name = "checkmyip"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# 单个 Worker 同时提供静态页面（public/）与 /api/* 接口
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# 查询其他 IP 时依次尝试的地理位置接口（逗号分隔）。可选：ip.sb, ipwho.is, geojs, ipapi.is, ipinfo, ipapi.co, ip-api
GEO_PROVIDERS = "ip.sb,ipwho.is,geojs,ipapi.is,ipinfo,ipapi.co"
# 外部查询结果缓存时间（秒）
CACHE_TTL = "21600"
# 每个外部请求的超时（毫秒）
LOOKUP_TIMEOUT_MS = "3000"
# 下面三个阈值只在缺少对应 Rate Limiting 绑定时使用（进程内计数，每 isolate 独立，较粗略；单位：次/分钟）
SELF_RATE_LIMIT = "60"
LOOKUP_RATE_LIMIT = "20"
SEEN_RATE_LIMIT = "10"
# 「本站观测」：同一 IP（IPv6 为 /64）每天最多新记录多少个不同浏览器指纹；满额后当天不再写 D1
SEEN_DAILY_CAP = "30"
# 「本站观测」：全站每天最多新写入多少行（保护 D1 免费额度 10 万行写入/天，索引与删除也计入）；达到后当天暂停统计，IP 检测不受影响
SEEN_GLOBAL_DAILY_CAP = "15000"
# 允许跨域调用 /api/ip?ip= 的来源（逗号分隔，含协议，不带结尾斜杠）。留空 = 只允许同源。
# v4./v6. 探测子域会自动允许其主域名；DEV_MODE=true 时额外允许 localhost / 127.0.0.1。
# /api/seen 永远只接受同源请求，不受此项影响。
ALLOWED_ORIGINS = ""

# ---------- Cloudflare Rate Limiting 绑定（默认启用，见 README「限流」）----------
# 按 Cloudflare 节点计数，key 为访问者 IP（IPv4 按地址，IPv6 按 /64，与「本站观测」计数相同）。缺少某个绑定时 Worker 会退回进程内计数，
# 每个 isolate 打印一次 console.warn，并在 /api/health 的 rateLimit / warnings 中显示。
# namespace_id 需在你的 Cloudflare 账号内唯一（正整数字符串）；period 只能是 10 或 60。
[[ratelimits]]
name = "SELF_LIMITER"          # 查询自己的 IP（页面加载）：宽松
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "LOOKUP_LIMITER"        # ?ip= 查询其他 IP：较严
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "SEEN_LIMITER"          # POST /api/seen 上报设备：严格
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60

# ---------- D1：「本站观测到的设备数」（可选，默认关闭；见 README「部署」与「本站观测」）----------
# 默认不绑定 D1：页面显示「本站统计未启用」，其余功能不受影响，`wrangler deploy` 可以直接成功。
# 不再放占位 database_id（全 0 的 UUID 会让真实部署报错 10021）；也不依赖 wrangler 的 D1 自动创建
# （TOML 配置下 wrangler 不会把创建出的 ID 写回本文件，之后 `d1 migrations apply --remote` 会因缺少 database_id 失败）。
# 启用步骤：
#   1. npx wrangler d1 create checkmyip                    → 记下输出里的 database_id
#   2. 把下面 D1 BEGIN / END 之间 5 行行首的 "# " 去掉，并把 database_id 换成第 1 步的 ID
#   3. npx wrangler d1 migrations apply checkmyip --remote  （即 npm run db:migrate:remote）
#   4. npx wrangler secret put IP_HASH_SALT                 （≥16 字符随机串，如 openssl rand -hex 32）
#   5. npm run deploy
# 本地试用不必改本文件：npm run db:migrate:local && npm run dev:d1（会生成已被 gitignore 的 wrangler.local-d1.toml）
# >>> D1 BEGIN
# [[d1_databases]]
# binding = "DB"
# database_name = "checkmyip"
# database_id = "<wrangler d1 create 输出的 ID>"
# migrations_dir = "migrations"
# <<< D1 END

# 每天 19:17 UTC（北京时间 03:17）删除 30 天前的观测记录；写入时也会惰性清理
[triggers]
crons = ["17 19 * * *"]

# 可选密钥请用 secret 设置，不要写进本文件：
#   npx wrangler secret put IPAPI_IS_KEY
#   npx wrangler secret put PROXYCHECK_KEY
#   npx wrangler secret put ABUSEIPDB_KEY
#   npx wrangler secret put IPINFO_TOKEN
#   npx wrangler secret put IP_HASH_SALT     # 「本站观测」哈希用的随机盐，至少 16 个字符，例如 openssl rand -hex 32
# 本地开发可写在 .dev.vars（见 .dev.vars.example）

# ====================== 模板：自定义域名（默认不启用）======================
# example.com 只是占位符。确定域名后：
#   1. 把下面三行里的 checkmyip.example.com 全部换成你的域名，并取消注释；
#   2. 同时修改 public/config.js 里的 SITE_DOMAIN；
#   3. 按 README「自定义域名」一节处理 v4 / v6 子域的 DNS（v4 只留 A、v6 只留 AAAA）。
# 保持注释状态时，部署只会得到 *.workers.dev 地址。
# routes = [
#   { pattern = "checkmyip.example.com", custom_domain = true },
#   { pattern = "v4.checkmyip.example.com", custom_domain = true },
#   { pattern = "v6.checkmyip.example.com", custom_domain = true },
# ]
# ===========================================================================
